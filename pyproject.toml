[project]
name = "autonomous-data-detective"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.1",
    "langchain>=1.4.5",
    "langchain-openai>=1.7.1",
    "langgraph>=1.2.15",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "pydantic-settings>=2.16.0",
    "python-multipart>=0.0.32",
    "scipy>=1.18.1",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
autonomous-data-detective = "autonomous_data_detective:main"

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]
