[project]
name = "autonomous-data-detective"
version = "0.1.0"
description = "Agentic AI application for CSV profiling, natural-language analysis, and evidence-validated insights."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.1",
    "langchain>=1.4.5",
    "langchain-openai>=1.7.1",
    "langgraph>=1.2.15",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "pydantic-settings>=2.16.0",
    "python-multipart>=0.0.32",
    "requests>=2.34.2",
    "scipy>=1.18.1",
    "streamlit>=1.67.0",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.4",
]

[tool.ruff.lint.per-file-ignores]
"src/autonomous_data_detective/graph/nodes.py" = ["BLE001"]
